name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag the binaries are attached to
        required: true

jobs:
  build:
    name: Build ${{ matrix.platform.name }}-${{ matrix.platform.arch }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, name: windows, arch: x86_64 }
          - { runner: windows-11-arm, name: windows, arch: arm64 }
          - { runner: macos-15-intel, name: mac, arch: x86_64 }
          - { runner: macos-latest, name: mac, arch: arm64 }
          - { runner: ubuntu-latest, name: linux, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, name: linux, arch: arm64 }

    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        env:
          PLATFORM: ${{ matrix.platform.name }}
          ARCH: ${{ matrix.platform.arch }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name || inputs.tag }}
        run: |
          # Release name for the asset: "1.5.0" and "v1.5.0" end up identical.
          RELEASE_NAME="${RELEASE_NAME#v}"

          cargo +stable build --release --locked

          ext=""
          if [[ "$PLATFORM" == "windows" ]]; then
            ext=".exe"
          fi

          mkdir artifacts
          mv \
            "./target/release/lunar_launcher_inject$ext" \
            "./artifacts/lunar-launcher-inject-$PLATFORM-$ARCH-$RELEASE_NAME$ext"

      - name: Upload Executable
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" ./artifacts/* --clobber
