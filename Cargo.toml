[package]
name = "lunar_launcher_inject"
version = "1.5.0"
edition = "2024"
description = "Injects JVM agents into Lunar Client by hooking its Electron launcher"
repository = "https://github.com/laiongabriel/lunar-launcher-inject"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
scopeguard = "1.2.0"
thiserror = "2.0.20"
tungstenite = "0.30.0"

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
pedantic = { level = "warn", priority = 3 }

[profile.release]
strip = true
lto = true
opt-level = "z"
